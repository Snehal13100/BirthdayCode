<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Sir</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#141e30,#243b55,#0f2027,#2c5364);
background-size:400% 400%;
animation:bg 10s infinite alternate;
overflow:hidden;
}

@keyframes bg{
0%{background-position:0% 50%;}
100%{background-position:100% 50%;}
}

.card{
width:90%;
max-width:850px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border-radius:20px;
padding:40px;
text-align:center;
color:white;
box-shadow:0 0 30px rgba(0,255,255,.5);
}

img{
width:180px;
height:180px;
border-radius:50%;
object-fit:cover;
border:6px solid cyan;
box-shadow:0 0 25px cyan;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{box-shadow:0 0 10px cyan;}
to{box-shadow:0 0 40px cyan;}
}

h1{
margin-top:20px;
font-size:48px;
color:#00ffff;
}

h2{
margin:10px 0;
color:gold;
}

.code{
margin-top:25px;
background:#111;
padding:20px;
border-radius:12px;
text-align:left;
color:#00ff66;
font-family:Consolas,monospace;
box-shadow:0 0 20px lime;
overflow:auto;
}

.message{
margin-top:25px;
font-size:20px;
line-height:1.8;
}

button{
margin-top:30px;
padding:15px 35px;
font-size:18px;
border:none;
border-radius:40px;
background:cyan;
color:black;
cursor:pointer;
font-weight:bold;
transition:.4s;
}

button:hover{
transform:scale(1.1);
background:#00ff66;
}

#confetti{
position:fixed;
top:0;
left:0;
z-index:-1;
}
</style>

</head>

<body>

<canvas id="confetti"></canvas>

<div class="card">

<img src="principalSirImg.jpg" alt="Sir">

<h2>🎂 Happy Birthday Principal Sir 🎂</h2>

<h3>From Snehal Anmol Tirpude </h3>


<div class="message">

Thank you for your guidance,
support and inspiration.

May this birthday bring
joy, happiness,
good health and
great success.

🎉 Have a wonderful year ahead! 🎉

</div>

<button onclick="celebrate()">🎁 Celebrate</button>

</div>

<script>

function celebrate(){

alert("🎂 Happy Birthday Sir!\n\nWishing you happiness, good health and endless success.");

}

const canvas=document.getElementById("confetti");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let p=[];

for(let i=0;i<250;i++){

p.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*6+2,
c:`hsl(${Math.random()*360},100%,50%)`

});

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

p.forEach(e=>{

ctx.beginPath();

ctx.arc(e.x,e.y,e.r,0,Math.PI*2);

ctx.fillStyle=e.c;

ctx.fill();

e.y+=2;

if(e.y>canvas.height){

e.y=-10;

e.x=Math.random()*canvas.width;

}

});

requestAnimationFrame(draw);

}

draw();

</script>

</body>
</html>
